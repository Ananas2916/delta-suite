# Test + exe su Windows a ogni push. Con un tag v* crea una BOZZA di release con l'exe:
# la pubblicazione resta manuale (GitHub → Releases → Edit → Publish).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dipendenze
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        env:
          DELTA_MUTE: "1"
        run: python -m pytest -q

      - name: Exe
        run: |
          python tools/make_icon.py
          python -m PyInstaller DeltaSuite.spec --noconfirm --clean --distpath dist

      - name: Autotest dell'exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $env:DELTA_SELFTEST = $out
          $p = Start-Process dist\DeltaSuite.exe -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "autotest bloccato" }
          Get-Content (Join-Path $out "selftest.txt")
          if (-not (Select-String -Path (Join-Path $out "selftest.txt") -Pattern "^mcp=ok" -Quiet)) {
            throw "autotest fallito"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaSuite-exe
          path: dist/DeltaSuite.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autotest-screenshot
          path: ${{ runner.temp }}/selftest
          retention-days: 14

      - name: Bozza di release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create "${{ github.ref_name }}" dist/DeltaSuite.exe --draft
          --title "Delta Suite ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
