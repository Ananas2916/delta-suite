# Tests + exe on Windows at every push. With a v* tag, or run by hand with "release" = v0.6.0, it creates a DRAFT
# release with the exe: publishing stays manual (GitHub → Releases → Edit → Publish).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Draft release to create with this build's exe (e.g. v0.6.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        env:
          DELTA_MUTE: "1"
        run: python -m pytest -q

      - name: Exe
        run: |
          python tools/make_icon.py
          python -m PyInstaller DeltaSuite.spec --noconfirm --clean --distpath dist

      - name: Exe self-test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $env:DELTA_SELFTEST = $out
          $p = Start-Process dist\DeltaSuite.exe -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "self-test hung" }
          Get-Content (Join-Path $out "selftest.txt")
          if (-not (Select-String -Path (Join-Path $out "selftest.txt") -Pattern "^mcp=ok" -Quiet)) {
            throw "self-test failed"
          }

      # artifacts are a convenience: a full storage quota must not block the draft release
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DeltaSuite-exe
          path: dist/DeltaSuite.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: autotest-screenshot
          path: ${{ runner.temp }}/selftest
          retention-days: 14

      # with a v* tag or with "release" in a manual run (GitHub creates the tag when the draft is published);
      # if the release already exists (draft created by hand, or published and so tagged) only the exe is updated
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
        shell: pwsh
        run: |
          # checksum next to the exe: the exe is not signed, so users can verify what they downloaded
          $hash = (Get-FileHash dist/DeltaSuite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DeltaSuite.exe" | Set-Content dist/DeltaSuite.exe.sha256 -Encoding ascii
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" dist/DeltaSuite.exe dist/DeltaSuite.exe.sha256 --clobber
          } else {
            # only this version's notes: the first section of RELEASE_NOTES.md, before the first "---"
            ((Get-Content RELEASE_NOTES.md -Raw) -split '\r?\n---\r?\n')[0] | Set-Content release_notes_this.md -Encoding utf8
            gh release create "$env:TAG" dist/DeltaSuite.exe dist/DeltaSuite.exe.sha256 --draft --target "${{ github.sha }}" `
              --title "Delta Suite $env:TAG" --notes-file release_notes_this.md
          }
