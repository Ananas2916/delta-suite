# Test + exe su Windows a ogni push. Con un tag v*, o lanciato a mano con "release" = v0.5.1, crea una BOZZA di
# release con l'exe: la pubblicazione resta manuale (GitHub → Releases → Edit → Publish).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Bozza di release da creare con l'exe di questa build (es. v0.5.1); vuoto = solo build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dipendenze
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        env:
          DELTA_MUTE: "1"
        run: python -m pytest -q

      - name: Exe
        run: |
          python tools/make_icon.py
          python -m PyInstaller DeltaSuite.spec --noconfirm --clean --distpath dist

      - name: Autotest dell'exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $env:DELTA_SELFTEST = $out
          $p = Start-Process dist\DeltaSuite.exe -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "autotest bloccato" }
          Get-Content (Join-Path $out "selftest.txt")
          if (-not (Select-String -Path (Join-Path $out "selftest.txt") -Pattern "^mcp=ok" -Quiet)) {
            throw "autotest fallito"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaSuite-exe
          path: dist/DeltaSuite.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autotest-screenshot
          path: ${{ runner.temp }}/selftest
          retention-days: 14

      # con un tag v* o con "release" nel lancio manuale (il tag lo crea GitHub quando la bozza si pubblica);
      # se la release c'è già (bozza creata a mano, o pubblicata e quindi taggata) si aggiorna solo l'exe
      - name: Bozza di release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
        shell: pwsh
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" dist/DeltaSuite.exe --clobber
          } else {
            gh release create "$env:TAG" dist/DeltaSuite.exe --draft --target "${{ github.sha }}" `
              --title "Delta Suite $env:TAG" --notes-file RELEASE_NOTES.md
          }
