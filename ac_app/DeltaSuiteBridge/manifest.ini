[ABOUT]
NAME = Delta Suite Bridge
AUTHOR = Delta Suite
VERSION = 1.5
DESCRIPTION = Connects Delta Suite: rivals, live setup and adjustments, engineer radio buttons, onboard video, race control (FCY/VSC) and the Delta Suite HUD.

[CORE]
LAZY = NONE  ; always active once AC loads the session, even with the window closed

[WINDOW_...]
ID = main
NAME = Delta Suite Bridge
ICON = icon.png
FUNCTION_MAIN = windowMain
SIZE = 360, 400

; ---- Delta Suite HUD: one window per element, move/resize/toggle them from the CSP apps bar

